<html lang="pt-br">

            justify-content: center;
            z-index: 100;
            gap: 15px;
            color: white;
        }

        .caixa-bloqueio {
            background: #15102a;
            padding: 25px;
            border-radius: 16px;
            border: 2px solid #9d4edd;
            text-align: center;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);

            max-width: 360px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .exibicao-codigo {
            background: #0d0e15;
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed #eccc68;
            color: #eccc68;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 2px;
        }

        .barra-topo {
            width: 100%;

            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;

                <div class="card-filme" onclick="abrirPlayer('https://www.youtube.com/embed/wzXG6fPeeHQ')">

    function verificarCodigo() {
        const inputCodigo = document.getElementById('codigo-acesso').value;
        const inputNome = document.getElementById('nome-usuario').value.trim();
        
        if (inputNome !== "") {
            nomeSalvo = inputNome;
            historicoContexto[0].content += ` O nome do usuário é ${nomeSalvo}. Chame-o por esse nome de forma natural durante as respostas.`;
        }

        if (inputCodigo === codigoAtual) {
            document.getElementById('tela-bloqueio').style.display = 'none';
            document.getElementById('codigo-acesso').value = "";
        } else {
            alert("❌ Código incorreto! Tente novamente.");
        }

    function criarNovoCodigo() {
        const novoCodigo = Math.floor(1000 + Math.random() * 9000).toString();
        codigoAtual = novoCodigo;
        document.getElementById('bloco-codigo-visivel').innerText = `Código Atual do Sistema: ${novoCodigo}`;
    }

    programarAutodestruicao(document.getElementById('msg-inicial'));

    function toggleMenu() {
        const menu = document.getElementById('menu-opcoes');
        menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
    }

    document.getElementById('msg').addEventListener('keydown', (e) => { if(e.key === 'Enter') enviar(); });

    document.getElementById('btn-imagem').addEventListener('click', () => {
        const input = document.getElementById('msg');
        if (input.value.trim() !== "") {
            input.value = "Crie uma imagem de " + input.value;
            enviar();
        } else {
            alert("Digite algo no campo de texto primeiro para criar a imagem!");
        }
    });

    function selecionarOpcao(texto) {
        document.getElementById('msg').value = texto;
        toggleMenu();
        enviar();
    }

    function programarAutodestruicao(elemento) {
        setTimeout(() => {
            if (elemento) {
                elemento.style.opacity = "0";
                elemento.style.transform = "scale(0.95)";
                setTimeout(() => { if (elemento.parentNode) elemento.remove(); }, 500);
            }
        }, 120000);
    }

    function deletarTudo() {
        document.getElementById('janela-chat').innerHTML = "";
    }

    async function enviar() {
        const key = document.getElementById('key-input').value;
        const input = document.getElementById('msg');
        const chat = document.getElementById('janela-chat');
        const texto = input.value.trim();

        if (!texto) return;

        document.getElementById('menu-opcoes').style.display = 'none';

        const idVoce = "voce-" + Date.now();
        chat.innerHTML += `<div class="balao voce" id="${idVoce}"><strong>Você:</strong> ${texto}</div>`;
        input.value = "";
        chat.scrollTop = chat.scrollHeight;
        programarAutodestruicao(document.getElementById(idVoce));

        const idLoading = "load-" + Date.now();
        chat.innerHTML += `<div class="balao ia" id="${idLoading}">Processando...</div>`;
        const balaoIA = document.getElementById(idLoading);
        chat.scrollTop = chat.scrollHeight;

        const textoLower = texto.toLowerCase();

        if (textoLower.includes("imagem") || textoLower.includes("desenhe") || textoLower.includes("foto")) {
            try {
                let basePrompt = texto.replace(/(crie uma imagem de|desenhe um|foto de|imagem de)/gi, "").trim();
                let conhecimentoYoutube = "";

                if (textoLower.includes("jazzghost")) {
                    basePrompt = "minecraft builder character, look like jazzghost channel style";
                    conhecimentoYoutube = ", cute cubic avatar, blocky castle construction, vibrant epic shaders, gaming thumbnail, 3d render";
                } else if (textoLower.includes("mrbeast") || textoLower.includes("mr beast")) {
                    conhecimentoYoutube = ", youtube set design, huge bright studio lighting, cinematic setup, 4k";
                } else if (textoLower.includes("minecraft")) {
                    conhecimentoYoutube = ", high quality 3d cubic blocks world, bright saturation, gaming background";
                } else {
                    conhecimentoYoutube = ", highly detailed digital art, vivid illustration";
                }

                const finalPrompt = encodeURIComponent(basePrompt + conhecimentoYoutube);
                const imgUrl = `https://image.pollinations.ai/p/${finalPrompt}?width=512&height=512&enhance=true&seed=${Math.floor(Math.random() * 1000)}`;
                
                balaoIA.innerHTML = `<strong>IA:</strong> Aqui está o processamento gráfico solicitado:<br><div class="media-container"><img src="${imgUrl}"></div>`;
            } catch (err) {
                balaoIA.innerText = "Erro ao processar imagem.";
            }
            programarAutodestruicao(balaoIA);
            chat.scrollTop = chat.scrollHeight;
            return;
        }

        try {
            historicoContexto.push({ role: "user", content: texto });
            if (historicoContexto.length > 11) historicoContexto.splice(1, 2);

            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                body: JSON.stringify({ model: "llama-3.3-70b-versatile", messages: historicoContexto })
            });

            const data = await res.json();
            if (data.choices && data.choices[0]) {
                const resposta = data.choices[0].message.content;
                balaoIA.innerHTML = `<strong>IA:</strong> ${resposta}`;
                historicoContexto.push({ role: "assistant", content: resposta });
            } else {
                balaoIA.innerText = "Houve um problema de conexão. Tente novamente.";
            }
        } catch (e) {
            balaoIA.innerText = "Erro ao conectar com a IA.";
        }
        
        programarAutodestruicao(balaoIA);
        chat.scrollTop = chat.scrollHeight;
    }
</script>
