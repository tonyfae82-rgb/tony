<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exibição de Imagem</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
        }

        .image-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
        }

        .caption {
            margin-top: 15px;
            color: #555;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="image-container">
        <img src="Imagem.png" alt="Mulher e cachorro na trilha">
        <p class="caption">Sua imagem local</p>
    </div>

</body>
</html>
